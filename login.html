<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EnrollEase | Login</title>
    <link rel="stylesheet" href="login.css">
    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
</head>
<body data-page="login">

    <div class="login-page">

        <header class="navbar">
            <a href="#" class="logo">
                <i class="fa-solid fa-graduation-cap"></i>
                <span>EnrollEase</span>
            </a>

            <div class="register">
                <span>Don't have an account?</span>
                <a href="register.html" class="register-btn">Register</a>
            </div>
        </header>

        <main class="main-content">

            <section class="welcome">
                <h1>Welcome Back,</h1>
                <h2>Student!</h2>
                <p>
                    Log in to your account to book your<br>
                    enrollment appointment, check your<br>
                    queue number, and stay updated.
                </p>
            </section>

            <section class="glass-card">

                <div class="card-heading">
                    <h2>Log In</h2>
                    <p>
                        Access your account and continue<br>
                        your enrollment journey.
                    </p>
                </div>

                <form action="#" method="post" id="loginForm" novalidate>

                    <div class="input-box">
                        <i class="fa-solid fa-user"></i>
                        <input type="text"
                               id="loginId"
                               name="loginId"
                               placeholder="Email Address or Student ID"
                               required>
                    </div>

                    <div class="input-box">
                        <i class="fa-solid fa-lock"></i>
                        <input type="password"
                               id="loginPassword"
                               name="loginPassword"
                               placeholder="Password"
                               required>
                        <i class="fa-regular fa-eye eye-icon"
                           id="togglePassword"></i>
                    </div>

                    <div class="form-options">
                        <label>
                            <input type="checkbox" checked>
                            <span>Remember me</span>
                        </label>

                        <a href="#" id="forgotLink">Forgot password ?</a>
                    </div>

                    <button type="submit" class="login-btn">
                        Log in <i class="fa-solid fa-arrow-right"></i>
                    </button>

                </form>

            </section>

        </main>

    </div>
    <div id="app"></div>
    <script src="entry.js"></script>
    <script src="script.js"></script>
</body>
</html>
