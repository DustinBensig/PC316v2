<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#f5f7fb">
    <meta name="description" content="Sign in to the EnrollEase administration dashboard.">
    <title>Administrator sign in | EnrollEase</title>
    <link rel="stylesheet" href="admin-login.css">
    <script src="../entry.js"></script>
    <script src="admin-login.js" defer></script>
  </head>
  <body>
    <main class="login-shell">
      <section class="login-card">
        <a class="login-brand" href="../index.html" aria-label="EnrollEase home"><span class="brand-mark">E</span><span>enroll<span class="brand-accent">ease</span></span></a>
        <p class="eyebrow">ADMINISTRATOR PORTAL</p>
        <h1>Admin Login</h1>
        <p class="intro">Sign in to the EnrollEase administration dashboard.</p>
        <div id="login-message" class="login-message" role="alert" aria-live="polite" hidden></div>
        <form id="admin-login-form">
          <label for="admin-username">Username</label>
          <input id="admin-username" name="username" type="text" autocomplete="username" maxlength="64" pattern="[A-Za-z0-9._-]{3,64}" placeholder="Enter your username" required>
          <label for="admin-password">Password</label>
          <div class="password-wrap"><input id="admin-password" name="password" type="password" autocomplete="current-password" maxlength="72" placeholder="Enter your password" required></div>
          <button class="login-submit" type="submit"><span>Login</span><span aria-hidden="true">→</span></button>
        </form>
        <p class="security-note">All administrative records are managed from one shared dashboard.</p>
        <a class="back-link" href="../landing.html">← Back to home</a>
      </section>
    </main>
  </body>
</html>
